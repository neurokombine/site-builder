<section class="блок блок--контакты тёмный" id="экран-23" data-тип="контакты">
  <!-- Контакты: последний экран, на котором человек решает написать сейчас, а не «потом». Слева три
       строки контактов с иконками, справа стеклянная карточка с кнопкой. КОНТАКТ_АДРЕС_N стоит дважды:
       в href — ссылка (mailto:, tel:, https://t.me/…), в тексте — то, что человек прочтёт глазами.
       Контакты — из профиля дословно; иконку меняй под способ: телеграм, ватсап, телефон, почта. -->
  <div class="блок__внутри">
    <div class="пара">
      <div class="пара__текст">
        <p class="кикер">Написать</p>
        <h2>Напишите — отвечу в тот же день</h2>
        <div class="контакт">
          {{ИКОНКА:телеграм}}
          <span><span class="контакт__что">Телеграм</span><a href="https://t.me/matematika_bez_paniki">@matematika_bez_paniki</a></span>
        </div>
        <div class="контакт">
          {{ИКОНКА:телефон}}
          <span><span class="контакт__что">Телефон</span><a href="tel:+79000000000">+7 900 000-00-00</a></span>
        </div>
        <div class="контакт">
          {{ИКОНКА:почта}}
          <span><span class="контакт__что">Почта</span><a href="mailto:anna@matematika-online.ru">anna@matematika-online.ru</a></span>
        </div>
      </div>
      <div class="карточка карточка--стекло">
        {{ИКОНКА:чат}}
        <p class="лид">Пара строк о ребёнке и классе — и я предложу время для занятия-разбора</p>
        <div>{{СВЯЗЬ:Написать}}</div>
      </div>
    </div>
  </div>
</section>
