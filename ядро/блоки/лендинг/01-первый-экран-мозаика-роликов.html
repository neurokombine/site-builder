<section class="блок блок--первый-экран первый-экран--мозаика-роликов тёмный фон--пятна" id="экран-{{НОМЕР}}" data-тип="первый-экран" data-схема="мозаика-роликов" data-картинка="мозаика">
  <div class="блок__внутри">
    <div class="первый-экран__текст">
      <p class="кикер">{{КИКЕР}}</p>
      <h1>{{ЗАГОЛОВОК}} <em class="акцент">{{АКЦЕНТ}}</em></h1>
      <p class="лид">{{ПОДЗАГОЛОВОК}}</p>
      <div class="первый-экран__действие">{{СВЯЗЬ:Оставить заявку}} <a class="кнопка кнопка--контур" href="#экран-{{ВТОРАЯ_ССЫЛКА_ЭКРАН}}">{{ВТОРАЯ_ССЫЛКА_ТЕКСТ}}</a></div>
      <p class="мелкий первый-экран__доверие">{{ИКОНКА:щит}} {{ДОВЕРИЕ}}</p>
      <ul class="цифры">
        <li class="цифра"><b class="цифра__значение">{{ЦИФРА_1}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_1}}</span></li>
        <li class="цифра"><b class="цифра__значение">{{ЦИФРА_2}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_2}}</span></li>
        <li class="цифра"><b class="цифра__значение">{{ЦИФРА_3}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_3}}</span></li>
      </ul>
    </div>
    <figure class="картинка картинка--мозаика ряд-роликов первый-экран__картинка"><div class="ряд-роликов__лента">
      <div class="рамка-телефона"><div class="рамка-телефона__экран"><video autoplay muted loop playsinline preload="metadata" poster="video/{{ПОСТЕР_1}}" data-лицо="{{ЛИЦО}}"><source src="video/{{РОЛИК_1}}.mp4" type="video/mp4"></video><p class="рамка-телефона__подпись мелкий">{{ПОДПИСЬ_РОЛИКА_1}}</p></div></div>
      <div class="рамка-телефона"><div class="рамка-телефона__экран"><video autoplay muted loop playsinline preload="metadata" poster="video/{{ПОСТЕР_2}}" data-лицо="{{ЛИЦО}}"><source src="video/{{РОЛИК_2}}.mp4" type="video/mp4"></video><p class="рамка-телефона__подпись мелкий">{{ПОДПИСЬ_РОЛИКА_2}}</p></div></div>
      <div class="рамка-телефона"><div class="рамка-телефона__экран"><video autoplay muted loop playsinline preload="metadata" poster="video/{{ПОСТЕР_3}}" data-лицо="{{ЛИЦО}}"><source src="video/{{РОЛИК_3}}.mp4" type="video/mp4"></video><p class="рамка-телефона__подпись мелкий">{{ПОДПИСЬ_РОЛИКА_3}}</p></div></div>
      <div class="рамка-телефона"><div class="рамка-телефона__экран"><video autoplay muted loop playsinline preload="metadata" poster="video/{{ПОСТЕР_4}}" data-лицо="{{ЛИЦО}}"><source src="video/{{РОЛИК_4}}.mp4" type="video/mp4"></video><p class="рамка-телефона__подпись мелкий">{{ПОДПИСЬ_РОЛИКА_4}}</p></div></div>
      <div class="рамка-телефона"><div class="рамка-телефона__экран"><video autoplay muted loop playsinline preload="metadata" poster="video/{{ПОСТЕР_5}}" data-лицо="{{ЛИЦО}}"><source src="video/{{РОЛИК_5}}.mp4" type="video/mp4"></video><p class="рамка-телефона__подпись мелкий">{{ПОДПИСЬ_РОЛИКА_5}}</p></div></div>
      <div class="рамка-телефона рамка-телефона--дубль" aria-hidden="true"><div class="рамка-телефона__экран"><video autoplay muted loop playsinline preload="metadata" poster="video/{{ПОСТЕР_1}}" data-лицо="{{ЛИЦО}}"><source src="video/{{РОЛИК_1}}.mp4" type="video/mp4"></video><p class="рамка-телефона__подпись мелкий">{{ПОДПИСЬ_РОЛИКА_1}}</p></div></div>
      <div class="рамка-телефона рамка-телефона--дубль" aria-hidden="true"><div class="рамка-телефона__экран"><video autoplay muted loop playsinline preload="metadata" poster="video/{{ПОСТЕР_2}}" data-лицо="{{ЛИЦО}}"><source src="video/{{РОЛИК_2}}.mp4" type="video/mp4"></video><p class="рамка-телефона__подпись мелкий">{{ПОДПИСЬ_РОЛИКА_2}}</p></div></div>
      <div class="рамка-телефона рамка-телефона--дубль" aria-hidden="true"><div class="рамка-телефона__экран"><video autoplay muted loop playsinline preload="metadata" poster="video/{{ПОСТЕР_3}}" data-лицо="{{ЛИЦО}}"><source src="video/{{РОЛИК_3}}.mp4" type="video/mp4"></video><p class="рамка-телефона__подпись мелкий">{{ПОДПИСЬ_РОЛИКА_3}}</p></div></div>
      <div class="рамка-телефона рамка-телефона--дубль" aria-hidden="true"><div class="рамка-телефона__экран"><video autoplay muted loop playsinline preload="metadata" poster="video/{{ПОСТЕР_4}}" data-лицо="{{ЛИЦО}}"><source src="video/{{РОЛИК_4}}.mp4" type="video/mp4"></video><p class="рамка-телефона__подпись мелкий">{{ПОДПИСЬ_РОЛИКА_4}}</p></div></div>
      <div class="рамка-телефона рамка-телефона--дубль" aria-hidden="true"><div class="рамка-телефона__экран"><video autoplay muted loop playsinline preload="metadata" poster="video/{{ПОСТЕР_5}}" data-лицо="{{ЛИЦО}}"><source src="video/{{РОЛИК_5}}.mp4" type="video/mp4"></video><p class="рамка-телефона__подпись мелкий">{{ПОДПИСЬ_РОЛИКА_5}}</p></div></div>
