<section class="блок блок--первый-экран первый-экран--живая-обложка тёмный" id="экран-{{НОМЕР}}" data-тип="первый-экран" data-схема="живая-обложка" data-картинка="видео">
  <figure class="картинка картинка--видео первый-экран__картинка"><video autoplay muted loop playsinline preload="metadata" poster="video/{{ПОСТЕР}}" data-телефон="video/{{ВИДЕО_ТЕЛЕФОН}}.mp4" data-телефон-постер="video/{{ПОСТЕР_ТЕЛЕФОН}}" data-лицо="{{ЛИЦО}}" aria-label="{{ПОДПИСЬ_ФОТО}}"><source src="video/{{ВИДЕО}}.webm" type="video/webm"><source src="video/{{ВИДЕО}}.mp4" type="video/mp4"></video><img src="video/{{ПОСТЕР}}" alt="{{ПОДПИСЬ_ФОТО}}" data-лицо="{{ЛИЦО}}"></figure>
  <span class="живое">живая обложка · без звука</span>
  <div class="блок__внутри">
    <div class="первый-экран__текст">
      <p class="кикер">{{КИКЕР}}</p>
      <h1>{{ЗАГОЛОВОК}} <em class="акцент">{{АКЦЕНТ}}</em></h1>
      <p class="лид">{{ПОДЗАГОЛОВОК}}</p>
      <div class="первый-экран__действие">{{СВЯЗЬ:Оставить заявку}} <a class="кнопка кнопка--контур" href="#экран-{{ВТОРАЯ_ССЫЛКА_ЭКРАН}}">{{ВТОРАЯ_ССЫЛКА_ТЕКСТ}}</a></div>
      <p class="мелкий первый-экран__доверие">{{ИКОНКА:щит}} {{ДОВЕРИЕ}}</p>
    </div>
  </div>
</section>
