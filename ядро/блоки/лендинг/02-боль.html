<section class="блок блок--боль блок--тихо блок--текстура ключ--глубже" id="экран-{{НОМЕР}}" data-тип="боль">
  <!-- Для кого: тихая секция без картинки — фактура с тающей сеткой, шапка и плитки-роли под ней.
       Иконок в плитках нет: адресата держит золотая строка имени, а не картинка рядом с ней.
       Первая плитка на компьютере занимает обе колонки — в неё ставится тот, ради кого собран
       экран, он читается первым. Ролей 3–6, ниже стоят три образцовые копии: нужно больше —
       копируй div роли и нумеруй слоты подряд, нужно меньше — стирай лишние целиком, вместе
       с тегом div. Пояснения у роли нет (в прототипе не было длинного тире) — сотри абзац,
       имя адресата останется одно. Подзаголовка нет — сотри лид, шапка встанет без него. -->
  <span class="сетка-текстура" aria-hidden="true"></span>
  <div class="блок__внутри">
    <div class="секция__шапка">
      <p class="кикер">{{КИКЕР}}</p>
      <h2>{{ЗАГОЛОВОК}}</h2>
      <p class="лид секция__лид">{{ПОДЗАГОЛОВОК}}</p>
    </div>
    <div class="текстура__список секция__тело">
      <div class="роль"><b>{{БОЛЬ_1}}</b><p>{{ПОЯСНЕНИЕ_1}}</p></div>
      <div class="роль"><b>{{БОЛЬ_2}}</b><p>{{ПОЯСНЕНИЕ_2}}</p></div>
      <div class="роль"><b>{{БОЛЬ_3}}</b><p>{{ПОЯСНЕНИЕ_3}}</p></div>
    </div>
  </div>
</section>
