<section class="блок блок--боль светлый второй" id="экран-{{НОМЕР}}" data-тип="боль">
  <div class="блок__внутри">
    <p class="кикер">{{КИКЕР}}</p>
    <h2>{{ЗАГОЛОВОК}}</h2>
    <div class="карточки">
      <article class="карточка">
        {{ИКОНКА:часы}}
        <h3>{{БОЛЬ_1}}</h3>
        <p>{{ПОЯСНЕНИЕ_1}}</p>
      </article>
      <article class="карточка карточка--главная">
        {{ИКОНКА:деньги}}
        <h3>{{БОЛЬ_2}}</h3>
        <p>{{ПОЯСНЕНИЕ_2}}</p>
      </article>
      <article class="карточка">
        {{ИКОНКА:лампочка}}
        <h3>{{БОЛЬ_3}}</h3>
        <p>{{ПОЯСНЕНИЕ_3}}</p>
      </article>
    </div>
    <hr class="разделитель">
    <p class="лид">{{ПОДЗАГОЛОВОК}}</p>
  </div>
</section>
