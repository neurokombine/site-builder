<section class="блок блок--вопросы-ответы ключ--глубже" id="экран-{{НОМЕР}}" data-тип="вопросы-ответы">

       две колонки, на телефоне одна. Один файл идёт на оба экрана. Вопросов не пять — сотри лишние details. -->
  <div class="блок__внутри">
    <div class="пара">
      <div class="пара__текст">
        <p class="кикер">{{КИКЕР}}</p>
        <h2>{{ЗАГОЛОВОК}}</h2>
      </div>
      <div>
        <details class="вопрос">
          <summary>{{ВОПРОС_1}}</summary>
          <p>{{ОТВЕТ_1}}</p>
        </details>
        <details class="вопрос">
          <summary>{{ВОПРОС_2}}</summary>
          <p>{{ОТВЕТ_2}}</p>
        </details>
        <details class="вопрос">
          <summary>{{ВОПРОС_3}}</summary>
          <p>{{ОТВЕТ_3}}</p>
        </details>
        <details class="вопрос">
          <summary>{{ВОПРОС_4}}</summary>
          <p>{{ОТВЕТ_4}}</p>
        </details>
        <details class="вопрос">
          <summary>{{ВОПРОС_5}}</summary>
          <p>{{ОТВЕТ_5}}</p>
        </details>
      </div>
    </div>
  </div>
</section>
