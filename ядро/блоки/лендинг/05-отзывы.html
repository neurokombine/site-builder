<section class="блок блок--отзывы светлый второй" id="экран-{{НОМЕР}}" data-тип="отзывы">
  <!-- Отзывы на лендинге — иерархия весов: одна большая цитата во всю ширину, разделитель, под ней
       пара карточек. ⛔ Источник обязателен: ОТКУДА_N — где отзыв лежит на самом деле (переписка,
       карта, площадка). Отзыв без имени и без источника видно с первой строки. -->
  <div class="блок__внутри">
    <p class="кикер">{{КИКЕР}}</p>
    <h2>{{ЗАГОЛОВОК}}</h2>
    <blockquote class="цитата">
      <p>{{ЦИТАТА_1}}</p>
      <footer class="цитата__кто"><span><b>{{КТО_1}}</b>{{ОТКУДА_1}}</span></footer>
    </blockquote>
    <hr class="разделитель">
    <div class="карточки карточки--две">
      <article class="карточка">
        {{ИКОНКА:чат}}
        <blockquote class="цитата">
          <p>{{ЦИТАТА_2}}</p>
          <footer class="цитата__кто"><span><b>{{КТО_2}}</b>{{ОТКУДА_2}}</span></footer>
        </blockquote>
      </article>
      <article class="карточка">
        {{ИКОНКА:звезда}}
        <blockquote class="цитата">
          <p>{{ЦИТАТА_3}}</p>
          <footer class="цитата__кто"><span><b>{{КТО_3}}</b>{{ОТКУДА_3}}</span></footer>
        </blockquote>
      </article>
    </div>
  </div>
</section>
