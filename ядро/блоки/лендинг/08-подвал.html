<section class="блок блок--подвал светлый" id="экран-{{НОМЕР}}" data-тип="подвал">
  <!-- Подвал лендинга: слева юр-блок и документы (оферта, политика), справа подпись и год. Всё — из профиля
       дословно, ни слова от себя: статус, реквизиты и лицензия — ответственность человека, а не текст.
       Нет документов — сотри абзац со слотом ДОКУМЕНТЫ: пустая строка выглядит забытой. -->
  <div class="блок__внутри">
    <div class="пара">
      <div class="пара__текст">
        <p>{{ЮР_БЛОК}}</p>
        <p>{{ДОКУМЕНТЫ}}</p>
      </div>
      <p>{{ПОДПИСЬ}} · {{ГОД}}</p>
    </div>
  </div>
</section>
