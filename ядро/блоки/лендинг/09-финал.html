<section class="блок блок--финал ключ--наоборот фон--пятна" id="экран-{{НОМЕР}}" data-тип="финал">
  <!-- Финальный призыв: слева заголовок, почему сейчас, кнопка и подпись под ней; справа стеклянная
       карточка с живым таймером (тикает таймер.js по data-дедлайн — ISO с +03:00, московское время).
       Нет даты — сотри карточку с .таймер целиком, вместе со строкой «До … (МСК)»: нули хуже пустоты. -->
  <div class="блок__внутри">
    <div class="пара">
      <div class="пара__текст">
        <p class="кикер">{{КИКЕР}}</p>
        <h2>{{ЗАГОЛОВОК}}</h2>
        <p class="лид">{{ПОЧЕМУ_СЕЙЧАС}}</p>
        <div>{{СВЯЗЬ:Оставить заявку}}</div>
        <p class="мелкий">{{ПОДПИСЬ_ПОД_КНОПКОЙ}}</p>
      </div>
      <div class="карточка карточка--стекло">
        <div class="таймер" data-дедлайн="{{ДЕДЛАЙН}}">
          <div class="таймер__ячейка"><b>00</b><span>дн</span></div>
          <div class="таймер__ячейка"><b>00</b><span>ч</span></div>
          <div class="таймер__ячейка"><b>00</b><span>мин</span></div>
        </div>
        <p class="мелкий">{{ИКОНКА:часы}} До {{ДЕДЛАЙН_СЛОВАМИ}} (МСК)</p>
      </div>
    </div>
  </div>
</section>
