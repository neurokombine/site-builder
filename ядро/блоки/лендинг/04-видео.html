<section class="блок блок--видео ключ--глубже" id="экран-{{НОМЕР}}" data-тип="видео">
  <!-- Видео-доказательство: слева окно с роликом, справа шапка, список «что увидите» и строка
       длительности. Ролик здесь довод, а не украшение — на компьютере он шире текста, а на
       телефоне идёт первым: сперва кадр, потом слова о нём.
       ⭐ Окно держит три формы, и ниже стоят все три по одной образцовой копии:
       1) адрес плеера у площадки с видео — окно с iframe;
       2) свой файл из video/ — окно с video: человек жмёт кнопку сам, ролик не стартует и не
          звучит до этого, автоплея на этом экране нет вовсе;
       3) ролика ещё нет — в окне заглушка, и экран честно говорит, что кадр ждут.
       Берёшь ту форму, под которую у человека есть материал, и стираешь две другие целиком,
       вместе с тегом figure. Смешивать формы нельзя: плеер на экране один.
       ⛔ Адрес плеера пишется только с https:// и только со своей площадки: чужая запись сюда не
       ставится даже временно — это экран про ЭТО дело, и подмену узнают по первому вопросу.
       ⛔ Дорожки субтитров (тег track) у ролика не бывает — ни здесь, ни на первом экране.
       Пунктов «что увидите» 3–5, ниже три образцовые копии: нужно больше — копируй li и нумеруй
       слоты подряд, нужно меньше — стирай лишние целиком, вместе с тегом li.
       ⛔ Длинное тире внутри пункта видно человеку: на экране он читает ту же фразу, которую
       написал в прототипе. Поэтому тире стоит ВНУТРИ того же span, что и пояснение, и первым в
       нём: пояснения у пункта нет (в прототипе не было тире) — стираешь span целиком, вместе с
       тире, и висячего тире после жирного заголовка не остаётся.
       Подзаголовка нет — сотри лид, шапка встанет без него. Подписи под окном нет — сотри
       figcaption, окно останется, а что это за запись, допиши словами в title плеера.
       Длительности нет — сотри строку целиком, вместе с иконкой: пустой строки не остаётся. -->
  <div class="блок__внутри">
    <div class="видео__сетка секция__тело">
      <figure class="мокап видео__плеер">
        <iframe src="{{ВИДЕО_АДРЕС}}" title="{{ПОДПИСЬ_ВИДЕО}}" loading="lazy" allowfullscreen></iframe>
        <figcaption>{{ПОДПИСЬ_ВИДЕО}}</figcaption>
      </figure>
      <figure class="мокап видео__плеер">
        <video controls preload="none" playsinline poster="video/{{ПОСТЕР}}" aria-label="{{ПОДПИСЬ_ВИДЕО}}"><source src="video/{{ВИДЕО}}.mp4" type="video/mp4"></video>
        <figcaption>{{ПОДПИСЬ_ВИДЕО}}</figcaption>
      </figure>
      <figure class="мокап видео__плеер">
        <div class="заглушка-картинки">заглушка</div>
        <figcaption>{{ПОДПИСЬ_ВИДЕО}}</figcaption>
      </figure>
      <div class="видео__текст">
        <div class="секция__шапка">
          <p class="кикер">{{КИКЕР}}</p>
          <h2>{{ЗАГОЛОВОК}}</h2>
          <p class="лид секция__лид">{{ПОДЗАГОЛОВОК}}</p>
        </div>
        <ul class="список-иконок видео__список">
          <li><i class="галка"></i><span><b>{{ПУНКТ_1}}</b><span> — {{ПОЯСНЕНИЕ_1}}</span></span></li>
          <li><i class="галка"></i><span><b>{{ПУНКТ_2}}</b><span> — {{ПОЯСНЕНИЕ_2}}</span></span></li>
          <li><i class="галка"></i><span><b>{{ПУНКТ_3}}</b><span> — {{ПОЯСНЕНИЕ_3}}</span></span></li>
        </ul>
        <p class="мелкий видео__длительность">{{ИКОНКА:часы}} {{ДЛИТЕЛЬНОСТЬ}}</p>
      </div>
    </div>
  </div>
</section>
