<section class="блок блок--условия блок--тихо блок--текстура светлый" id="экран-{{НОМЕР}}" data-тип="условия">
  <!-- Чего мы не обещаем: тихая секция без картинки, строки-плитки, у каждой длинное тире вместо
       маркера. Тире рисуют стили — в текст его не ставь, иначе на экране будет два тире подряд.
       Строк 3–6, ниже стоят три образцовые копии: нужно больше — копируй li и нумеруй слоты
       подряд, нужно меньше — стирай лишние целиком, вместе с тегом li. Пояснения у строки нет
       (в прототипе не было длинного тире) — сотри span с пояснением целиком.
       Экран честный, а не пугающий: кнопки здесь нет, шаг человек делает на соседнем экране. -->
  <span class="сетка-текстура" aria-hidden="true"></span>
  <div class="блок__внутри">
    <div class="секция__шапка">
      <p class="кикер">{{КИКЕР}}</p>
      <h2>{{ЗАГОЛОВОК}}</h2>
      <span class="черта"></span>
      <p class="секция__лид">{{ПОДЗАГОЛОВОК}}</p>
    </div>
    <ul class="условия">
      <li><b>{{УСЛОВИЕ_1}}</b> <span>{{ПОЯСНЕНИЕ_1}}</span></li>
      <li><b>{{УСЛОВИЕ_2}}</b> <span>{{ПОЯСНЕНИЕ_2}}</span></li>
      <li><b>{{УСЛОВИЕ_3}}</b> <span>{{ПОЯСНЕНИЕ_3}}</span></li>
    </ul>
  </div>
</section>
