<section class="блок блок--условия блок--тихо блок--текстура ключ--основной" id="экран-{{НОМЕР}}" data-тип="условия">
  <!-- Чего мы не обещаем: тихая секция без картинки — фактура с тающей сеткой, шапка без черты и
       строки-плитки под ней. Вместо маркера у каждой строки золотое длинное тире, и рисуют его
       стили — в текст его не ставь, иначе у строки будет два тире подряд.
       ⛔ Кнопки на этом экране нет, и это не пропажа: шаг человек делает на соседнем экране, а
       здесь читает честные границы. Экран честный, а не пугающий.
       Строк 3–6, ниже стоят три образцовые копии: нужно больше — копируй li и нумеруй слоты
       подряд, нужно меньше — стирай лишние целиком, вместе с тегом li.
       ⛔ Длинное тире ВНУТРИ строки видно человеку: на экране он читает ту же фразу, которую
       написал в прототипе. Деление строки на две части — это про то, как система её ЧИТАЕТ, а не
       про то, как печатает. Поэтому тире стоит внутри того же span, что и пояснение, и первым в
       нём: пояснения у строки нет (в прототипе не было тире) — стираешь span целиком, вместе с
       тире, и висячего тире после жирного начала не остаётся.
       Подзаголовка нет — сотри лид, шапка встанет без него. -->
  <span class="сетка-текстура" aria-hidden="true"></span>
  <div class="блок__внутри">
    <div class="секция__шапка">
      <p class="кикер">{{КИКЕР}}</p>
      <h2>{{ЗАГОЛОВОК}}</h2>
      <p class="лид секция__лид">{{ПОДЗАГОЛОВОК}}</p>
    </div>
    <ul class="условия секция__тело">
      <li><b>{{УСЛОВИЕ_1}}</b><span> — {{ПОЯСНЕНИЕ_1}}</span></li>
      <li><b>{{УСЛОВИЕ_2}}</b><span> — {{ПОЯСНЕНИЕ_2}}</span></li>
      <li><b>{{УСЛОВИЕ_3}}</b><span> — {{ПОЯСНЕНИЕ_3}}</span></li>
    </ul>
  </div>
</section>
