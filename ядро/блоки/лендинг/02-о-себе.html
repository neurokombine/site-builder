<section class="блок блок--о-себе ключ--наоборот" id="экран-{{НОМЕР}}" data-тип="о-себе">
  <!-- Об авторе: разворот — рассказ и ряд цифр в одной колонке, портрет в другой; на компьютере
       фотография стоит слева от текста, на телефоне она ложится сверху во всю ширину.
       Хвост заголовка — вторая половина мысли: отдельной строкой, мельче и золотом, чтобы
       длинный заголовок не читался капслоком. Хвоста нет — сотри span целиком, заголовок
       останется одной фразой. Абзаца рассказа нет (в прототипе нет поля «Текст») — сотри
       абзац, останутся имя, роль и цифры.
       Рассказ идёт двумя абзацами: первый — про дело, второй — про тех, кто рядом (поле
       «Второй абзац» прототипа). Второго поля нет или оно пустое — сотри второй абзац
       целиком, вместе с тегом: экран от этого не ломается и дырки не оставляет.
       Цифр 2–4, ниже стоят четыре образцовые копии: нужно меньше — стирай лишние целиком,
       вместе с тегом li. Цифра — короткое число с единицей, подпись под ней — одно-два слова;
       длинную фразу сюда не ставят, ряд рассыпется. Подписи на портрете нет — сотри figcaption,
       фотография останется.
       ⭐ Портрета нет вовсе — не стирай figure: половина разворота станет дырой, а экран держится
       ровно на том, что человека видно. Поставь вместо картинки заглушку — серый прямоугольник
       со словом: <div class="заглушка-картинки">заглушка</div>. Честно и видно, что место ждёт
       фотографию (ядро/блоки.md, раздел 5-bis). -->
  <span class="пятно" aria-hidden="true"></span>
  <div class="блок__внутри">
    <div class="разворот__сетка разворот__сетка--лево">
      <div class="секция__тело">
        <div class="секция__шапка">
          <p class="кикер">{{КИКЕР}}</p>
          <h2>{{ЗАГОЛОВОК}}<span class="хвост-акцент">{{ХВОСТ_ЗАГОЛОВКА}}</span></h2>
          <p class="лид секция__лид"><b>{{ИМЯ}}</b> · {{РОЛЬ}}</p>
        </div>
        <p>{{ТЕКСТ}}</p>
        <p>{{ВТОРОЙ_АБЗАЦ}}</p>
        <ul class="цифры">
          <li class="цифра"><b class="цифра__значение">{{ЦИФРА_1}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_1}}</span></li>
          <li class="цифра"><b class="цифра__значение">{{ЦИФРА_2}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_2}}</span></li>
          <li class="цифра"><b class="цифра__значение">{{ЦИФРА_3}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_3}}</span></li>
          <li class="цифра"><b class="цифра__значение">{{ЦИФРА_4}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_4}}</span></li>
        </ul>
      </div>
      <figure class="фото">
        <img src="img/{{ФОТО}}" alt="{{ИМЯ}}">
        <figcaption class="плашка фото__подпись">{{ПОДПИСЬ_ФОТО}}</figcaption>
      </figure>
    </div>
  </div>
</section>
