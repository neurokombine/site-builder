<!-- Два разных экрана в одном файле. Оставь ОДИН, второй сотри вместе с его комментарием:
     «для кого» — человек узнаёт себя в описании и читает дальше;
     «об авторе» — человек решает, доверять ли тому, кто это ведёт. -->
<section class="блок блок--о-себе светлый второй" id="экран-{{НОМЕР}}" data-тип="о-себе">
  <div class="блок__внутри">
    <h2>{{ЗАГОЛОВОК}}</h2>

    <!-- Раскладка «для кого» -->
    <p class="лид">{{ПОДЗАГОЛОВОК}}</p>
    <ul class="карточки">
      <li class="карточка">
        <h3>{{КОМУ}}</h3>
        <p>{{ЧТО_ПОЛУЧИТ}}</p>
      </li>
      <li class="карточка">
        <h3>{{КОМУ}}</h3>
        <p>{{ЧТО_ПОЛУЧИТ}}</p>
      </li>
      <li class="карточка">
        <h3>{{КОМУ}}</h3>
        <p>{{ЧТО_ПОЛУЧИТ}}</p>
      </li>
    </ul>

    <!-- Раскладка «об авторе» -->
    <div class="пара">
      <div class="пара__фото">
        <img src="img/{{ФОТО}}" alt="{{ПОДПИСЬ_ФОТО}}">
      </div>
      <div class="пара__текст">
        <p class="лид"><strong>{{ИМЯ}}</strong> · {{РОЛЬ}}</p>
        <p>{{ТЕКСТ}}</p>
      </div>
    </div>
    <ul class="карточки">
      <li class="карточка">{{ФАКТ}}</li>
      <li class="карточка">{{ФАКТ}}</li>
      <li class="карточка">{{ФАКТ}}</li>
    </ul>
  </div>
</section>
