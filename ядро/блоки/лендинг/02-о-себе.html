<section class="блок блок--о-себе тёмный" id="экран-{{НОМЕР}}" data-тип="о-себе">
  <!-- Об авторе на лендинге: тёмная секция, текст | портрет, под ними три стеклянные карточки-факта,
       у каждой своя иконка. Факты — из профиля дословно, выдуманных достижений здесь быть не должно. -->
  <div class="блок__внутри">
    <div class="пара">
      <div class="пара__текст">
        <p class="кикер">{{КИКЕР}}</p>
        <h2>{{ЗАГОЛОВОК}}</h2>
        <p class="лид"><b>{{ИМЯ}}</b> · {{РОЛЬ}}</p>
        <p>{{ТЕКСТ}}</p>
      </div>
      <figure class="фото пара__фото">
        <img src="img/{{ФОТО}}" alt="{{ИМЯ}}">
        <figcaption>{{ПОДПИСЬ_ФОТО}}</figcaption>
      </figure>
    </div>
    <div class="карточки">
      <article class="карточка карточка--стекло">
        {{ИКОНКА:награда}}
        <p>{{ФАКТ_1}}</p>
      </article>
      <article class="карточка карточка--стекло">
        {{ИКОНКА:часы}}
        <p>{{ФАКТ_2}}</p>
      </article>
      <article class="карточка карточка--стекло">
        {{ИКОНКА:группа}}
        <p>{{ФАКТ_3}}</p>
      </article>
    </div>
  </div>
</section>
