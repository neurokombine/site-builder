<section class="блок блок--кейс тёмный" id="экран-{{НОМЕР}}" data-тип="кейс">
  <!-- Кейс: одна история целиком. Слева «Было» и «Стало» двумя плитками и ряд цифр под ними,
       справа — слова самого человека отдельной карточкой; на телефоне всё идёт столбиком.
       ⭐ Кромка у карточки со словами сплошная. Пунктир в этой системе значит «текста ещё нет»
       (место под отзыв), и настоящую цитату им отмечать нельзя — их перестанут различать.
       Цифр 2–4, ниже стоят три образцовые копии: нужно больше — копируй строку и нумеруй слоты
       подряд, нужно меньше — стирай лишние целиком, вместе с тегом. Цифр нет вовсе — сотри
       список, «было → стало» останется одно. Цитаты нет — сотри карточку целиком, и левая
       колонка встанет во всю ширину. Портрета нет — сотри картинку, имя и подпись останутся.
       Подзаголовка нет — сотри лид.
       Цифры и слова — настоящие, из переписки, отчёта или разрешённого отзыва: выдуманной
       истории здесь не бывает, её узнают. -->
  <span class="пятно" aria-hidden="true"></span>
  <div class="блок__внутри">
    <div class="секция__шапка">
      <p class="кикер">{{КИКЕР}}</p>
      <h2>{{ЗАГОЛОВОК}}</h2>
      <p class="лид секция__лид">{{ПОДЗАГОЛОВОК}}</p>
    </div>
    <div class="пара секция__тело">
      <div class="пара__текст">
        <div class="кейс__пара">
          <div class="роль"><b>Было</b><p>{{БЫЛО}}</p></div>
          <div class="роль роль--итог"><b>Стало</b><p>{{СТАЛО}}</p></div>
        </div>
        <ul class="цифры">
          <li class="цифра"><b class="цифра__значение">{{ЦИФРА_1}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_1}}</span></li>
          <li class="цифра"><b class="цифра__значение">{{ЦИФРА_2}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_2}}</span></li>
          <li class="цифра"><b class="цифра__значение">{{ЦИФРА_3}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_3}}</span></li>
        </ul>
      </div>
      <blockquote class="цитата-карточка">
        <p class="цитата-карточка__текст">{{ЦИТАТА}}</p>
        <footer class="цитата__кто">
          <img class="аватар" src="img/{{ФОТО}}" alt="{{КТО}}">
          <span><b>{{КТО}}</b>{{ПОДПИСЬ_ФОТО}}</span>
        </footer>
      </blockquote>
    </div>
  </div>
</section>
