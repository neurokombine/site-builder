<section class="блок блок--кейс тёмный" id="экран-{{НОМЕР}}" data-тип="кейс">
  <!-- Кейс: одна история с контрастом «было → стало», три цифры результата и слова самого человека
       с его фото-аватаром. Цифры и цитата — настоящие, из переписки или отчёта; нет цифр — сотри ul.цифры. -->
  <div class="блок__внутри">
    <p class="кикер">{{КИКЕР}}</p>
    <h2>{{ЗАГОЛОВОК}}</h2>
    <div class="пара">
      <div class="пара__текст">
        <div class="карточки карточки--две">
          <article class="карточка">
            {{ИКОНКА:часы}}
            <h3>Было</h3>
            <p>{{БЫЛО}}</p>
          </article>
          <article class="карточка карточка--стекло">
            {{ИКОНКА:молния}}
            <h3>Стало</h3>
            <p>{{СТАЛО}}</p>
          </article>
        </div>
        <ul class="цифры">
          <li class="цифра"><b class="цифра__значение">{{ЦИФРА_1}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_1}}</span></li>
          <li class="цифра"><b class="цифра__значение">{{ЦИФРА_2}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_2}}</span></li>
          <li class="цифра"><b class="цифра__значение">{{ЦИФРА_3}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_3}}</span></li>
        </ul>
      </div>
      <blockquote class="цитата">
        <p>{{ЦИТАТА}}</p>
        <footer class="цитата__кто">
          <img class="аватар" src="img/{{ФОТО}}" alt="{{ПОДПИСЬ_ФОТО}}" loading="lazy">
          <span><b>{{КТО}}</b>{{ПОДПИСЬ_ФОТО}}</span>
        </footer>
      </blockquote>
    </div>
  </div>
</section>
