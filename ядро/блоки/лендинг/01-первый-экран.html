<!-- Первый экран лендинга: обещание, доказательство и одно действие.
     Цифры в строке доказательства — только настоящие, из профиля; нет трёх — оставь одну.
     Вторая ссылка ведёт вниз по странице, к экрану с ценой или программой. -->
<section class="блок блок--первый-экран тёмный" id="экран-{{НОМЕР}}" data-тип="первый-экран">
  <div class="блок__внутри пара">
    <div class="пара__текст">
      <h1>{{ЗАГОЛОВОК}}</h1>
      <p class="лид">{{ПОДЗАГОЛОВОК}}</p>
      <ul class="список">
        <li>{{ПУНКТ}}</li>
        <li>{{ПУНКТ}}</li>
        <li>{{ПУНКТ}}</li>
      </ul>
      <ul class="цифры">
        <li class="цифра">
          <span class="цифра__значение">{{ЦИФРА}}</span>
          <span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ}}</span>
        </li>
        <li class="цифра">
          <span class="цифра__значение">{{ЦИФРА}}</span>
          <span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ}}</span>
        </li>
        <li class="цифра">
          <span class="цифра__значение">{{ЦИФРА}}</span>
          <span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ}}</span>
        </li>
      </ul>
      <div class="связь">
        {{СВЯЗЬ:Оставить заявку}}
        <a class="кнопка контурная" href="#экран-{{ВТОРАЯ_ССЫЛКА_ЭКРАН}}">{{ВТОРАЯ_ССЫЛКА_ТЕКСТ}}</a>
      </div>
    </div>
    <div class="пара__фото">
      <img src="img/{{ФОТО}}" alt="{{ПОДПИСЬ_ФОТО}}">
    </div>
  </div>
</section>
