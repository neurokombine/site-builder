<section class="блок блок--что-получите светлый второй" id="экран-{{НОМЕР}}" data-тип="что-получите">
  <!-- Что получите: разворот — слева список того, что остаётся у человека после работы, справа
       фотография результата. Под списком врезка: чем это остаётся в руках, когда работа кончилась.
       Пунктов 3–8, ниже стоят три образцовые копии: нужно больше — копируй li и нумеруй слоты
       подряд, нужно меньше — стирай лишние целиком, вместе с тегом li.
       Пояснения у пункта нет (в прототипе не было длинного тире) — сотри пояснение,
       жирный заголовок остаётся один. Фотографии нет — сотри figure целиком, список встанет
       на всю ширину. Врезки нет (в прототипе нет строки «После шагов») — сотри её тоже. -->
  <div class="блок__внутри">
    <div class="секция__шапка">
      <p class="кикер">{{КИКЕР}}</p>
      <h2>{{ЗАГОЛОВОК}}</h2>
      <span class="черта"></span>
      <p class="секция__лид">{{ПОДЗАГОЛОВОК}}</p>
    </div>
    <div class="разворот__сетка">
      <div class="секция__тело">
        <ul class="список-иконок">
          <li>{{ИКОНКА:галочка}}<span><b>{{ПОЛУЧИТЕ_1}}</b> {{ПОЯСНЕНИЕ_1}}</span></li>
          <li>{{ИКОНКА:галочка}}<span><b>{{ПОЛУЧИТЕ_2}}</b> {{ПОЯСНЕНИЕ_2}}</span></li>
          <li>{{ИКОНКА:галочка}}<span><b>{{ПОЛУЧИТЕ_3}}</b> {{ПОЯСНЕНИЕ_3}}</span></li>
        </ul>
        <div class="врезка">
          <b>{{ИТОГ}}</b>
          <p>{{ПОЯСНЕНИЕ_ИТОГА}}</p>
        </div>
      </div>
      <figure class="фото">
        <img src="img/{{ФОТО}}" alt="{{ПОДПИСЬ_ФОТО}}">
      </figure>
    </div>
  </div>
</section>
