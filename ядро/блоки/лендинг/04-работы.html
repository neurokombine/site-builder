<section class="блок блок--работы светлый" id="экран-{{НОМЕР}}" data-тип="работы">
  <!-- Работы на лендинге: сверху окно-мокап с видео (только внутри figure.мокап — голый iframe
       схлопывается), ниже три мокапа работ, у каждой результат крупной цифрой. Нет видео — сотри
       первый figure целиком. Свои работы снимают, а не генерят: чужие кадры сюда не кладём. -->
  <div class="блок__внутри">
    <p class="кикер">{{КИКЕР}}</p>
    <h2>{{ЗАГОЛОВОК}}</h2>
    <figure class="мокап">
      <iframe src="{{ВИДЕО_АДРЕС}}" title="{{ЗАГОЛОВОК}}" allowfullscreen></iframe>
    </figure>
    <div class="карточки">
      <figure class="мокап">
        <img src="img/{{ФАЙЛ_1}}" alt="{{НАЗВАНИЕ_1}}">
        <figcaption>
          <p class="цифра"><b class="цифра__значение">{{РЕЗУЛЬТАТ_1}}</b></p>
          <h3>{{НАЗВАНИЕ_1}}</h3>
          <p>{{ЧТО_СДЕЛАЛИ_1}}</p>
        </figcaption>
      </figure>
      <figure class="мокап">
        <img src="img/{{ФАЙЛ_2}}" alt="{{НАЗВАНИЕ_2}}">
        <figcaption>
          <p class="цифра"><b class="цифра__значение">{{РЕЗУЛЬТАТ_2}}</b></p>
          <h3>{{НАЗВАНИЕ_2}}</h3>
          <p>{{ЧТО_СДЕЛАЛИ_2}}</p>
        </figcaption>
      </figure>
      <figure class="мокап">
        <img src="img/{{ФАЙЛ_3}}" alt="{{НАЗВАНИЕ_3}}">
        <figcaption>
          <p class="цифра"><b class="цифра__значение">{{РЕЗУЛЬТАТ_3}}</b></p>
          <h3>{{НАЗВАНИЕ_3}}</h3>
          <p>{{ЧТО_СДЕЛАЛИ_3}}</p>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
