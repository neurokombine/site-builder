<!-- Работы и кейсы: сделанное с результатом, который можно назвать цифрой.
     В каждой карточке оставь одно — картинку или видео, — а второе сотри.
     ⛔ {{РЕЗУЛЬТАТ}} — то, что человек может проверить, а не круглое обещание. -->
<section class="блок блок--работы светлый" id="экран-{{НОМЕР}}" data-тип="работы">
  <div class="блок__внутри">
    <h2>{{ЗАГОЛОВОК}}</h2>
    <p class="лид">{{ПОДЗАГОЛОВОК}}</p>
    <ul class="карточки">
      <li class="карточка">
        <img class="работа__картинка" src="img/{{ФАЙЛ}}" alt="{{НАЗВАНИЕ}}">
        <div class="видео"><iframe src="{{ВИДЕО_АДРЕС}}" title="{{НАЗВАНИЕ}}" allowfullscreen></iframe></div>
        <h3>{{НАЗВАНИЕ}}</h3>
        <p>{{ЧТО_СДЕЛАЛИ}}</p>
        <span class="результат">{{РЕЗУЛЬТАТ}}</span>
      </li>
      <li class="карточка">
        <img class="работа__картинка" src="img/{{ФАЙЛ}}" alt="{{НАЗВАНИЕ}}">
        <h3>{{НАЗВАНИЕ}}</h3>
        <p>{{ЧТО_СДЕЛАЛИ}}</p>
        <span class="результат">{{РЕЗУЛЬТАТ}}</span>
      </li>
      <li class="карточка">
        <img class="работа__картинка" src="img/{{ФАЙЛ}}" alt="{{НАЗВАНИЕ}}">
        <h3>{{НАЗВАНИЕ}}</h3>
        <p>{{ЧТО_СДЕЛАЛИ}}</p>
        <span class="результат">{{РЕЗУЛЬТАТ}}</span>
      </li>
    </ul>
  </div>
</section>
