<section class="блок блок--программа тёмный" id="экран-{{НОМЕР}}" data-тип="программа">
  <!-- Программа / что внутри: четыре шага с номерами и нитью между ними, у каждого бейдж срока
       («неделя 1», «2 встречи»). Один файл идёт на «Что получите» и «Что внутри»; шагов меньше —
       сотри лишние li вместе с номером. -->
  <div class="блок__внутри">
    <p class="кикер">{{КИКЕР}}</p>
    <h2>{{ЗАГОЛОВОК}}</h2>
    <ol class="шаги">
      <li class="шаг">
        <span class="шаг__номер">1</span>
        <div>
          <h3>{{ШАГ_1}} <span class="бейдж">{{СРОК_1}}</span></h3>
          <p>{{ОПИСАНИЕ_ШАГА_1}}</p>
        </div>
      </li>
      <li class="шаг">
        <span class="шаг__номер">2</span>
        <div>
          <h3>{{ШАГ_2}} <span class="бейдж">{{СРОК_2}}</span></h3>
          <p>{{ОПИСАНИЕ_ШАГА_2}}</p>
        </div>
      </li>
      <li class="шаг">
        <span class="шаг__номер">3</span>
        <div>
          <h3>{{ШАГ_3}} <span class="бейдж">{{СРОК_3}}</span></h3>
          <p>{{ОПИСАНИЕ_ШАГА_3}}</p>
        </div>
      </li>
      <li class="шаг">
        <span class="шаг__номер">4</span>
        <div>
          <h3>{{ШАГ_4}} <span class="бейдж">{{СРОК_4}}</span></h3>
          <p>{{ОПИСАНИЕ_ШАГА_4}}</p>
        </div>
      </li>
    </ol>
  </div>
</section>
