<section class="блок блок--решение светлый" id="экран-{{НОМЕР}}" data-тип="решение">
  <!-- Как это работает: слева заголовок и кнопка, справа три шага с номерами и нитью между ними —
       путь от заявки до результата, а не список. На телефоне шаги идут под заголовком. -->
  <div class="блок__внутри">
    <div class="пара">
      <div class="пара__текст">
        <p class="кикер">{{КИКЕР}}</p>
        <h2>{{ЗАГОЛОВОК}}</h2>
        <hr class="разделитель">
        <div>{{СВЯЗЬ:Оставить заявку}}</div>
      </div>
      <ol class="шаги">
        <li class="шаг">
          <span class="шаг__номер">1</span>
          <div>
            <h3>{{ШАГ_1}}</h3>
            <p>{{ОПИСАНИЕ_ШАГА_1}}</p>
          </div>
        </li>
        <li class="шаг">
          <span class="шаг__номер">2</span>
          <div>
            <h3>{{ШАГ_2}}</h3>
            <p>{{ОПИСАНИЕ_ШАГА_2}}</p>
          </div>
        </li>
        <li class="шаг">
          <span class="шаг__номер">3</span>
          <div>
            <h3>{{ШАГ_3}}</h3>
            <p>{{ОПИСАНИЕ_ШАГА_3}}</p>
          </div>
        </li>
      </ol>
    </div>
  </div>
</section>
