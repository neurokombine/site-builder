<section class="блок блок--решение блок--тихо блок--текстура светлый" id="экран-{{НОМЕР}}" data-тип="решение">
  <!-- Как работаем: тихая секция без картинки — фактура с тающей сеткой, центрированная шапка и
       лента шагов под ней. На компьютере шаги стоят в ряд и между ними тянется нить, на телефоне
       идут колонкой и нить пропадает — вбок ей там указывать некуда.
       ⛔ Кнопки на этом экране нет, и это единственный экран страницы без неё: главная кнопка
       живёт на первом экране, в тарифах и в финале, а здесь человек ещё смотрит дорогу.
       Шагов 3–6, ниже стоят три образцовые копии: нужно больше — копируй div шага, нумеруй слоты
       подряд и поправь цифру в кружке, нужно меньше — стирай лишние целиком, вместе с тегом div.
       Номер в кружке — обычный текст, а не счётчик: он совпадает с номером слотов шага.
       Срока у шага нет (в прототипе не было пометки «срок») — сотри бейдж, заголовок шага
       останется один. Врезки нет (в прототипе нет строки «После шагов») — сотри её целиком,
       лента кончится последним шагом. -->
  <span class="сетка-текстура" aria-hidden="true"></span>
  <div class="блок__внутри">
    <div class="секция__шапка секция__шапка--центр">
      <p class="кикер">{{КИКЕР}}</p>
      <h2>{{ЗАГОЛОВОК}}</h2>
    </div>
    <div class="лента секция__тело">
      <div class="шаг">
        <div class="шаг__номер">1</div>
        <b>{{ШАГ_1}} <span class="бейдж">{{СРОК_1}}</span></b>
        <p>{{ОПИСАНИЕ_ШАГА_1}}</p>
      </div>
      <div class="шаг">
        <div class="шаг__номер">2</div>
        <b>{{ШАГ_2}} <span class="бейдж">{{СРОК_2}}</span></b>
        <p>{{ОПИСАНИЕ_ШАГА_2}}</p>
      </div>
      <div class="шаг">
        <div class="шаг__номер">3</div>
        <b>{{ШАГ_3}} <span class="бейдж">{{СРОК_3}}</span></b>
        <p>{{ОПИСАНИЕ_ШАГА_3}}</p>
      </div>
    </div>
    <div class="врезка">
      <p>{{ИТОГ}}</p>
    </div>
  </div>
</section>
