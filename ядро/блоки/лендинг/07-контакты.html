<section class="блок блок--контакты ключ--глубже" id="экран-{{НОМЕР}}" data-тип="контакты">
  <!-- Контакты на лендинге: три карточки-способа с иконками, под ними разделитель и кнопка.
       КОНТАКТ_АДРЕС_N стоит дважды: в href — ссылка (mailto:, tel:, https://t.me/…), в тексте — то,
       что человек прочтёт глазами. Контакты — из профиля дословно; иконку меняй под способ. -->
  <div class="блок__внутри">
    <p class="кикер">{{КИКЕР}}</p>
    <h2>{{ЗАГОЛОВОК}}</h2>
    <p class="лид">{{ПОДЗАГОЛОВОК}}</p>
    <div class="карточки">
      <article class="карточка">
        {{ИКОНКА:телеграм}}
        <h3>{{КОНТАКТ_НАЗВАНИЕ_1}}</h3>
        <p><a href="{{КОНТАКТ_АДРЕС_1}}">{{КОНТАКТ_АДРЕС_1}}</a></p>
      </article>
      <article class="карточка карточка--главная">
        {{ИКОНКА:телефон}}
        <h3>{{КОНТАКТ_НАЗВАНИЕ_2}}</h3>
        <p><a href="{{КОНТАКТ_АДРЕС_2}}">{{КОНТАКТ_АДРЕС_2}}</a></p>
      </article>
      <article class="карточка">
        {{ИКОНКА:почта}}
        <h3>{{КОНТАКТ_НАЗВАНИЕ_3}}</h3>
        <p><a href="{{КОНТАКТ_АДРЕС_3}}">{{КОНТАКТ_АДРЕС_3}}</a></p>
      </article>
    </div>
    <hr class="разделитель">
    <div>{{СВЯЗЬ:Оставить заявку}}</div>
  </div>
</section>
