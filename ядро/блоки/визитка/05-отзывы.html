<section class="блок блок--отзывы блок--тихо блок--текстура светлый" id="экран-{{НОМЕР}}" data-тип="отзывы">
  <!-- Отзывы: слова другого человека убеждают сильнее ваших обещаний. Та же тихая секция с
       фактурой, что и на большой странице: шапка по центру, карточки в ряд — три на широком
       экране, столбиком на телефоне.
       ⭐ У карточки ДВЕ формы, и в одной сетке они не смешиваются. Ниже стоит по одной образцовой
       копии каждой: берёшь ту, что про это дело, вторую стираешь целиком вместе с тегом.
       1) Отзывы есть — карточка со СПЛОШНОЙ кромкой: метка (услуга или тариф), цитата, портрет,
          имя и источник. ⛔ Источник обязателен: ОТКУДА_N — где отзыв лежит на самом деле
          (переписка, карта, площадка). Отзыв без имени и без источника видно с первой строки.
       2) Отзывов ещё нет — та же карточка ПУНКТИРОМ: контурный аватар, контурные звёзды, курсив
          «Текст отзыва появится здесь» и строка «Имя и город — после потока». Эту форму включает
          только поле прототипа «Отзывов ещё нет», и строка человека из этого поля встаёт абзацем
          под сеткой: он сам говорит, почему отзывов пока нет. Поля нет и отзывов нет — экрана нет
          вовсе, пустую сетку на страницу не ставим.
       ⛔ Кромка решает всё: пунктир значит «текста ещё нет», сплошная — «это слова человека».
       Перепутаешь — заглушку примут за отзыв, который не прогрузился. Ни имени, ни города, ни
       цитаты, ни оценки система не придумывает. Звёзды стоят только в заглушке и только контуром —
       это набросок пустого места, а не оценка; закрашивать их нельзя, и в карточке настоящего
       отзыва звёзд нет вовсе: оценку взять неоткуда.
       Две строки заглушки — служебные слова блока, а не слоты: «после потока» меняется на то,
       после чего отзывы появятся у этого человека (после первых заказов, после сдачи объекта).
       Карточек 2–6, на визитке по умолчанию три: нужно больше — копируй карточку и нумеруй слоты
       подряд, нужно меньше — стирай лишние целиком, вместе с тегом. Обе копии ниже пронумерованы
       первой карточкой: одна из них всё равно уйдёт, а нумерацию продолжаешь от той, что осталась.
       Метки нет — сотри пилюлю; портрета нет — сотри картинку, имя и источник останутся;
       подзаголовка нет — сотри лид; отзывы есть — сотри абзац под сеткой. -->
  <span class="сетка-текстура" aria-hidden="true"></span>
  <div class="блок__внутри">
    <div class="секция__шапка секция__шапка--центр">
      <p class="кикер">{{КИКЕР}}</p>
      <h2>{{ЗАГОЛОВОК}}</h2>
      <p class="лид секция__лид">{{ПОДЗАГОЛОВОК}}</p>
    </div>
    <div class="отзывы-сетка секция__тело">
      <blockquote class="цитата-карточка">
        <span class="цитата-карточка__метка">{{МЕТКА_1}}</span>
        <p class="цитата-карточка__текст">{{ЦИТАТА_1}}</p>
        <footer class="цитата__кто">
          <img class="аватар" src="img/{{ФОТО_1}}" alt="{{КТО_1}}">
          <span><b>{{КТО_1}}</b>{{ОТКУДА_1}}</span>
        </footer>
      </blockquote>
      <div class="отзыв-заглушка">
        <span class="отзыв-заглушка__аватар">{{ИКОНКА:пользователь}}</span>
        <span class="отзыв-заглушка__метка">{{МЕТКА_1}}</span>
        <div class="отзыв-заглушка__звёзды">{{ИКОНКА:звезда}}{{ИКОНКА:звезда}}{{ИКОНКА:звезда}}{{ИКОНКА:звезда}}{{ИКОНКА:звезда}}</div>
        <p class="отзыв-заглушка__текст">Текст отзыва появится здесь</p>
        <span class="отзыв-заглушка__имя">Имя и город — после потока</span>
      </div>
    </div>
    <p class="мелкий">{{ОТЗЫВОВ_ЕЩЁ_НЕТ}}</p>
  </div>
</section>
