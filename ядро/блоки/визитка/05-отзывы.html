<section class="блок блок--отзывы светлый" id="экран-{{НОМЕР}}" data-тип="отзывы">
  <!-- Отзывы: слова другого человека убеждают сильнее ваших обещаний. Три карточки-цитаты, средняя
       главная. ⛔ Источник обязателен: ОТКУДА_N — где отзыв лежит на самом деле (переписка, карта,
       площадка). Отзыв без имени и без источника видно с первой строки. -->
  <div class="блок__внутри">
    <p class="кикер">{{КИКЕР}}</p>
    <h2>{{ЗАГОЛОВОК}}</h2>
    <div class="карточки">
      <article class="карточка">
        <blockquote class="цитата">
          <p>{{ЦИТАТА_1}}</p>
          <footer class="цитата__кто"><span><b>{{КТО_1}}</b>{{ОТКУДА_1}}</span></footer>
        </blockquote>
      </article>
      <article class="карточка карточка--главная">
        <blockquote class="цитата">
          <p>{{ЦИТАТА_2}}</p>
          <footer class="цитата__кто"><span><b>{{КТО_2}}</b>{{ОТКУДА_2}}</span></footer>
        </blockquote>
      </article>
      <article class="карточка">
        <blockquote class="цитата">
          <p>{{ЦИТАТА_3}}</p>
          <footer class="цитата__кто"><span><b>{{КТО_3}}</b>{{ОТКУДА_3}}</span></footer>
        </blockquote>
      </article>
    </div>
  </div>
</section>
