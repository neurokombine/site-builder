<section class="блок блок--первый-экран первый-экран--сцена тёмный" id="экран-{{НОМЕР}}" data-тип="первый-экран" data-схема="сцена" data-картинка="фото">
  <figure class="картинка картинка--сцена первый-экран__картинка"><picture><source media="(max-width: 899px)" srcset="img/{{ФОТО_ТЕЛЕФОН}}"><img src="img/{{ФОТО}}" alt="{{ПОДПИСЬ_ФОТО}}" data-лицо="{{ЛИЦО}}" fetchpriority="high"></picture></figure>
  <div class="блок__внутри">
    <div class="первый-экран__текст">
      <p class="кикер">{{КИКЕР}}</p>
      <h1>{{ЗАГОЛОВОК}} <em class="акцент">{{АКЦЕНТ}}</em></h1>
      <p class="лид">{{ПОДЗАГОЛОВОК}}</p>
      <div class="первый-экран__действие">{{СВЯЗЬ:Написать}}</div>
      <p class="мелкий первый-экран__доверие">{{ИКОНКА:щит}} {{ДОВЕРИЕ}}</p>
    </div>
  </div>
</section>
