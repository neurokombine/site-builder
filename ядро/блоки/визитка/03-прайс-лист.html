<section class="блок блок--прайс-лист блок--громко ключ--основной" id="экран-{{НОМЕР}}" data-тип="прайс-лист">
  <!-- Прайс мастера на визитке: услуга · цена «от» · условие. Секция и шапка — те же, что у
       тарифов, а тело другое: это НЕ матрёшка. Ни строки «всё из предыдущего плюс», ни бейджа
       «Рекомендуем», ни подсвеченной карточки: работы заказывают поштучно, а не пакетом. Поле
       «Подсветить» на этом экране не работает, и это не пропажа.
       Состав услуги на визитке не разворачиваем — для этого есть лендинг; здесь строка должна
       читаться за секунду.
       Строк 3–8, ниже стоят три образцовые копии: нужно больше — копируй article и нумеруй слоты
       подряд, нужно меньше — стирай лишние целиком, вместе с тегом article.
       Цена пишется словом «от», если она от объёма: это текст прототипа, а не наша приписка.
       Условия у строки нет — сотри мелкий span рядом с ценой; пояснения нет — сотри абзац;
       строки-пояснения под списком нет — сотри её абзац.
       Кнопка одна на весь экран, под списком после разделителя. -->
  <span class="пятно" aria-hidden="true"></span>
  <span class="сетка-текстура" aria-hidden="true"></span>
  <div class="блок__внутри">
    <div class="секция__шапка секция__шапка--центр">
      <p class="кикер">{{КИКЕР}}</p>
      <h2>{{ЗАГОЛОВОК}}</h2>
      <p class="лид секция__лид">{{ПОДЗАГОЛОВОК}}</p>
    </div>
    <div class="тарифы секция__тело">
      <article class="тариф">
        <h3 class="тариф__имя">{{УСЛУГА_1}}</h3>
        <p class="тариф__цена"><b>{{ЦЕНА_1}}</b><span class="мелкий">{{УСЛОВИЕ_1}}</span></p>
        <p class="тариф__пояснение">{{ОПИСАНИЕ_УСЛУГИ_1}}</p>
      </article>
      <article class="тариф">
        <h3 class="тариф__имя">{{УСЛУГА_2}}</h3>
        <p class="тариф__цена"><b>{{ЦЕНА_2}}</b><span class="мелкий">{{УСЛОВИЕ_2}}</span></p>
        <p class="тариф__пояснение">{{ОПИСАНИЕ_УСЛУГИ_2}}</p>
      </article>
      <article class="тариф">
        <h3 class="тариф__имя">{{УСЛУГА_3}}</h3>
        <p class="тариф__цена"><b>{{ЦЕНА_3}}</b><span class="мелкий">{{УСЛОВИЕ_3}}</span></p>
        <p class="тариф__пояснение">{{ОПИСАНИЕ_УСЛУГИ_3}}</p>
      </article>
    </div>
    <p class="мелкий">{{ПОЯСНЕНИЕ_ЦЕН}}</p>
    <hr class="разделитель">
    <div class="действие-секции">{{СВЯЗЬ:Написать}}</div>
  </div>
</section>
