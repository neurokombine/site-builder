<section class="блок блок--прайс-лист блок--громко светлый" id="экран-{{НОМЕР}}" data-тип="прайс-лист">
  <!-- Прайс мастера на визитке: услуга · цена «от» · условие, без состава и без матрёшки тарифов —
       ни «всё из предыдущего +», ни бейджа «Рекомендуем», ни главной средней карточки: работы
       заказывают поштучно, а не пакетом. Состав услуги на визитке не разворачиваем — для этого
       есть лендинг; здесь строка должна читаться за секунду.
       Строк 3–8, ниже стоят три образцовые копии: нужно больше — копируй article и нумеруй слоты
       подряд, нужно меньше — стирай лишние целиком, вместе с тегом article.
       Цена пишется словом «от», если она от объёма: это текст прототипа, а не наша приписка.
       Условия у строки нет — сотри подпись рядом с ценой. Кнопка одна на весь экран, под списком. -->
  <div class="блок__внутри">
    <div class="секция__шапка">
      <p class="кикер">{{КИКЕР}}</p>
      <h2>{{ЗАГОЛОВОК}}</h2>
      <span class="черта"></span>
      <p class="секция__лид">{{ПОДЗАГОЛОВОК}}</p>
    </div>
    <div class="тарифы">
      <article class="тариф">
        <h3 class="тариф__имя">{{УСЛУГА_1}}</h3>
        <p class="тариф__цена"><b>{{ЦЕНА_1}}</b><span class="цифра__подпись">{{УСЛОВИЕ_1}}</span></p>
        <p>{{ОПИСАНИЕ_УСЛУГИ_1}}</p>
      </article>
      <article class="тариф">
        <h3 class="тариф__имя">{{УСЛУГА_2}}</h3>
        <p class="тариф__цена"><b>{{ЦЕНА_2}}</b><span class="цифра__подпись">{{УСЛОВИЕ_2}}</span></p>
        <p>{{ОПИСАНИЕ_УСЛУГИ_2}}</p>
      </article>
      <article class="тариф">
        <h3 class="тариф__имя">{{УСЛУГА_3}}</h3>
        <p class="тариф__цена"><b>{{ЦЕНА_3}}</b><span class="цифра__подпись">{{УСЛОВИЕ_3}}</span></p>
        <p>{{ОПИСАНИЕ_УСЛУГИ_3}}</p>
      </article>
    </div>
    <hr class="разделитель">
    <div>{{СВЯЗЬ:Написать}}</div>
  </div>
</section>
