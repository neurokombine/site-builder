<section class="блок блок--о-себе светлый второй" id="экран-{{НОМЕР}}" data-тип="о-себе">
  <!-- Почему я: человек уже понял, что услуга подходит, и решает, доверить ли дело вам.
       Текст слева, портрет справа; три факта — из профиля дословно, у каждого своя иконка. -->
  <div class="блок__внутри">
    <div class="пара">
      <div class="пара__текст">
        <p class="кикер">{{КИКЕР}}</p>
        <h2>{{ЗАГОЛОВОК}}</h2>
        <p class="лид"><b>{{ИМЯ}}</b> · {{РОЛЬ}}</p>
        <p>{{ТЕКСТ}}</p>
        <hr class="разделитель">
        <ul class="список-иконок">
          <li>{{ИКОНКА:награда}}<span>{{ФАКТ_1}}</span></li>
          <li>{{ИКОНКА:часы}}<span>{{ФАКТ_2}}</span></li>
          <li>{{ИКОНКА:группа}}<span>{{ФАКТ_3}}</span></li>
        </ul>
      </div>
      <figure class="фото пара__фото">
        <img src="img/{{ФОТО}}" alt="{{ИМЯ}}" loading="lazy">
        <figcaption>{{ПОДПИСЬ_ФОТО}}</figcaption>
      </figure>
    </div>
  </div>
</section>
