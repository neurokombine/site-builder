<section class="блок блок--подвал ключ--основной" id="экран-{{НОМЕР}}" data-тип="подвал">
  <!-- Подвал визитки: три колонки на компьютере, одна на телефоне. Слева знак дела и подпись под
       ним; в середине «Разделы» — ссылки на экраны этой же страницы; справа «Документы и контакты» —
       оферта, политика, согласие на обработку данных, сведения об организации, почта и телефон.
       Ниже отбита полоса: юридическая строка, адрес и год.
       ⛔ Всё, кроме служебных заголовков колонок, приходит ИЗ ПРОФИЛЯ дословно: статус, реквизиты,
       лицензия, адрес, почта и номер — ответственность человека, а не текст, который правят для
       красоты. Ни одного адреса, номера и названия документа в ядре нет и быть не может.
       Знак дела — то же слово, что стоит в шапке первого экрана: знак у дела один, второй раз его
       не придумывают.
       Колонку «Разделы» заполняет сборка, а не верстальщик: какие экраны встали на страницу и
       какие у них номера, знает вся страница целиком, а не отдельный экран. В рецепте поэтому одна
       образцовая ссылка — сборка размножит её по числу экранов и назовёт каждый его же кикером
       (кикера нет — заголовком). Первый экран и сам подвал в колонку не идут: на первый ведёт знак
       дела, а подвал — это она сама. У визитки экранов мало, и колонка коротка — так и должно быть;
       разделов нет вовсе (страница из одного экрана) — сборка уберёт всю колонку.
       Документы — по ссылке на строку, каждая вида
       <a href="…" target="_blank" rel="noopener">Оферта</a>: они уводят со страницы, и вкладку с
       сайтом человек терять не должен. Документов нет — сотри строку целиком, пустая выглядит
       забытой. Почта и телефон стоят дважды: в href — ссылка (mailto:, tel:), в тексте — то, что
       человек прочтёт глазами; способов меньше — сотри лишнюю ссылку вместе с тегом.
       Лицензия живёт внутри юридической строки, отдельного места у неё нет. Адреса нет — сотри
       его строку, полоса сойдётся сама. -->
  <div class="блок__внутри">
    <div class="подвал__сетка">
      <div>
        <span class="подвал__лого">{{ЗНАК}}</span>
        <p>{{ПОДПИСЬ}}</p>
      </div>
      <div>
        <h4>Разделы</h4>
        <div class="подвал__ссылки подвал__разделы">
          <a href="#{{РАЗДЕЛ_ЭКРАН_1}}">{{РАЗДЕЛ_1}}</a>
        </div>
      </div>
      <div>
        <h4>Документы и контакты</h4>
        <div class="подвал__ссылки">
          {{ДОКУМЕНТЫ}}
          <a href="{{КОНТАКТ_АДРЕС_1}}">{{КОНТАКТ_АДРЕС_1}}</a>
          <a href="{{КОНТАКТ_АДРЕС_2}}">{{КОНТАКТ_АДРЕС_2}}</a>
        </div>
      </div>
    </div>
    <div class="подвал__низ">
      <span>{{ЮР_БЛОК}}</span>
      <span>{{АДРЕС}}</span>
      <span>© {{ГОД}}</span>
    </div>
  </div>
</section>
