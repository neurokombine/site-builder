<section class="блок блок--первый-экран первый-экран--товар-крупно светлый" id="экран-{{НОМЕР}}" data-тип="первый-экран" data-схема="товар-крупно" data-картинка="товар">
  <div class="блок__внутри">
    <div class="первый-экран__текст">
      <p class="кикер">{{КИКЕР}}</p>
      <h1>{{ЗАГОЛОВОК}} <em class="акцент">{{АКЦЕНТ}}</em></h1>
      <p class="лид">{{ПОДЗАГОЛОВОК}}</p>
      <div class="первый-экран__действие">{{СВЯЗЬ:Написать}}</div>
      <p class="мелкий первый-экран__доверие">{{ИКОНКА:щит}} {{ДОВЕРИЕ}}</p>
      <ul class="цифры">
        <li class="цифра"><b class="цифра__значение">{{ЦИФРА_1}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_1}}</span></li>
        <li class="цифра"><b class="цифра__значение">{{ЦИФРА_2}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_2}}</span></li>
        <li class="цифра"><b class="цифра__значение">{{ЦИФРА_3}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_3}}</span></li>
      </ul>
    </div>
    <figure class="картинка картинка--товар первый-экран__картинка">
      <div class="рамка-телефона"><div class="рамка-телефона__экран"><picture><source media="(max-width: 899px)" srcset="img/{{ФОТО_ТЕЛЕФОН}}"><img src="img/{{ФОТО}}" alt="{{ПОДПИСЬ_ФОТО}}" data-лицо="{{ЛИЦО}}" fetchpriority="high"></picture></div></div>
      <span class="бейдж картинка__бейдж парит">{{ИКОНКА:молния}}{{АРТЕФАКТ_1}} {{АРТЕФАКТ_ПОДПИСЬ_1}}</span>
      <span class="бейдж картинка__бейдж парит парит--2">{{ИКОНКА:звезда}}{{АРТЕФАКТ_2}} {{АРТЕФАКТ_ПОДПИСЬ_2}}</span>
      <span class="бейдж картинка__бейдж парит парит--3">{{ИКОНКА:галочка}}{{АРТЕФАКТ_3}} {{АРТЕФАКТ_ПОДПИСЬ_3}}</span>
    </figure>
  </div>
</section>
