<section class="блок блок--работы светлый второй" id="экран-{{НОМЕР}}" data-тип="работы">
  <!-- Работы: показываем сделанное, а не рассказываем о нём. Та же витрина плиток 9 : 13, что и на
       большой странице: две колонки на телефоне, три на широком экране, шапка по центру.
       ⭐ Плитка держит три формы, и ниже стоят все три по одной образцовой копии:
       1) ролик — окно с плеером внутри плитки (адрес ролика от хозяина площадки);
       2) снимок — кадр работы файлом из папки с картинками;
       3) ничего нет — тёмная фактура с сеткой и кнопкой плей.
       Кадр гасит фактуру под собой и снимает кнопку плей: у плеера своя кнопка, а на снимке
       играть нечему. Смешивать формы в одной сетке можно.
       Плиток 3–8, на визитке по умолчанию три: нужно больше — копируй плитку и нумеруй слоты
       подряд, нужно меньше — стирай лишние целиком, вместе с тегом. Чужих кадров сюда не кладём:
       свои работы снимают. Формата нет — сотри чип; итога нет — сотри мелкую строку внизу
       подписи; пояснения под сеткой нет — сотри абзац; подзаголовка нет — сотри лид. -->
  <div class="блок__внутри">
    <div class="секция__шапка секция__шапка--центр">
      <p class="кикер">{{КИКЕР}}</p>
      <h2>{{ЗАГОЛОВОК}}</h2>
      <p class="лид секция__лид">{{ПОДЗАГОЛОВОК}}</p>
    </div>
    <div class="работы__сетка секция__тело">
      <div class="работа">
        <figure class="мокап работа__кадр"><iframe src="{{ВИДЕО_АДРЕС_1}}" title="{{НАЗВАНИЕ_1}}" allowfullscreen></iframe></figure>
        <span class="работа__формат">{{ФОРМАТ_1}}</span>
        <span class="работа__подпись"><b>{{НАЗВАНИЕ_1}}</b>{{ЧТО_СДЕЛАЛИ_1}}<span class="работа__итог">{{РЕЗУЛЬТАТ_1}}</span></span>
        <span class="работа__шкала"><i></i></span>
      </div>
      <div class="работа">
        <figure class="мокап работа__кадр"><img src="img/{{ФАЙЛ_2}}" alt="{{НАЗВАНИЕ_2}}"></figure>
        <span class="работа__формат">{{ФОРМАТ_2}}</span>
        <span class="работа__подпись"><b>{{НАЗВАНИЕ_2}}</b>{{ЧТО_СДЕЛАЛИ_2}}<span class="работа__итог">{{РЕЗУЛЬТАТ_2}}</span></span>
        <span class="работа__шкала"><i></i></span>
      </div>
      <div class="работа">
        <span class="работа__формат">{{ФОРМАТ_3}}</span>
        <span class="плей" aria-hidden="true">{{ИКОНКА:воспроизведение}}</span>
        <span class="работа__подпись"><b>{{НАЗВАНИЕ_3}}</b>{{ЧТО_СДЕЛАЛИ_3}}<span class="работа__итог">{{РЕЗУЛЬТАТ_3}}</span></span>
        <span class="работа__шкала"><i></i></span>
      </div>
    </div>
    <p class="мелкий">{{ПОЯСНЕНИЕ_РАБОТ}}</p>
  </div>
</section>
