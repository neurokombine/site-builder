<section class="блок блок--работы светлый второй" id="экран-{{НОМЕР}}" data-тип="работы">
  <!-- Работы: показываем сделанное, а не рассказываем о нём. Три окна-мокапа со скриншотом или кадром
       работы, под каждым — название, что сделали и результат бейджем. Свои работы снимают, а не генерят. -->
  <div class="блок__внутри">
    <p class="кикер">{{КИКЕР}}</p>
    <h2>{{ЗАГОЛОВОК}}</h2>
    <div class="карточки">
      <figure class="мокап">
        <img src="img/{{ФАЙЛ_1}}" alt="{{НАЗВАНИЕ_1}}" loading="lazy">
        <figcaption>
          <h3>{{НАЗВАНИЕ_1}}</h3>
          <p>{{ЧТО_СДЕЛАЛИ_1}}</p>
          <span class="бейдж">{{ИКОНКА:галочка}} {{РЕЗУЛЬТАТ_1}}</span>
        </figcaption>
      </figure>
      <figure class="мокап">
        <img src="img/{{ФАЙЛ_2}}" alt="{{НАЗВАНИЕ_2}}" loading="lazy">
        <figcaption>
          <h3>{{НАЗВАНИЕ_2}}</h3>
          <p>{{ЧТО_СДЕЛАЛИ_2}}</p>
          <span class="бейдж">{{ИКОНКА:галочка}} {{РЕЗУЛЬТАТ_2}}</span>
        </figcaption>
      </figure>
      <figure class="мокап">
        <img src="img/{{ФАЙЛ_3}}" alt="{{НАЗВАНИЕ_3}}" loading="lazy">
        <figcaption>
          <h3>{{НАЗВАНИЕ_3}}</h3>
          <p>{{ЧТО_СДЕЛАЛИ_3}}</p>
          <span class="бейдж">{{ИКОНКА:галочка}} {{РЕЗУЛЬТАТ_3}}</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
