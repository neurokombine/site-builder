<!-- Контакты: последний экран, на котором человек решает написать сейчас, а не «потом».
     {{КОНТАКТ_АДРЕС}} стоит дважды: в href — ссылка по правилу профиля (mailto:, tel:,
     https://t.me/…), в тексте — то, что человек прочтёт глазами. Контакты берём из
     профиля дословно и ни одного не придумываем. -->
<section class="блок блок--контакты тёмный" id="экран-{{НОМЕР}}" data-тип="контакты">
  <div class="блок__внутри">
    <h2>{{ЗАГОЛОВОК}}</h2>
    <p class="лид">{{ТЕКСТ}}</p>
    <ul class="контакты-список">
      <li class="контакт">
        <span class="контакт__что">{{КОНТАКТ_НАЗВАНИЕ}}</span>
        <a href="{{КОНТАКТ_АДРЕС}}">{{КОНТАКТ_АДРЕС}}</a>
      </li>
      <li class="контакт">
        <span class="контакт__что">{{КОНТАКТ_НАЗВАНИЕ}}</span>
        <a href="{{КОНТАКТ_АДРЕС}}">{{КОНТАКТ_АДРЕС}}</a>
      </li>
      <li class="контакт">
        <span class="контакт__что">{{КОНТАКТ_НАЗВАНИЕ}}</span>
        <a href="{{КОНТАКТ_АДРЕС}}">{{КОНТАКТ_АДРЕС}}</a>
      </li>
    </ul>
    <div class="связь">{{СВЯЗЬ:Написать}}</div>
  </div>
</section>
