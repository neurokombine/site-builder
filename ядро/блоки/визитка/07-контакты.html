<section class="блок блок--контакты тёмный" id="экран-{{НОМЕР}}" data-тип="контакты">
  <!-- Контакты: последний экран, на котором человек решает написать сейчас, а не «потом». Слева три
       строки контактов с иконками, справа стеклянная карточка с кнопкой. КОНТАКТ_АДРЕС_N стоит дважды:
       в href — ссылка (mailto:, tel:, https://t.me/…), в тексте — то, что человек прочтёт глазами.
       Контакты — из профиля дословно; иконку меняй под способ: телеграм, ватсап, телефон, почта. -->
  <div class="блок__внутри">
    <div class="пара">
      <div class="пара__текст">
        <p class="кикер">{{КИКЕР}}</p>
        <h2>{{ЗАГОЛОВОК}}</h2>
        <div class="контакт">
          {{ИКОНКА:телеграм}}
          <span><span class="контакт__что">{{КОНТАКТ_НАЗВАНИЕ_1}}</span><a href="{{КОНТАКТ_АДРЕС_1}}">{{КОНТАКТ_АДРЕС_1}}</a></span>
        </div>
        <div class="контакт">
          {{ИКОНКА:телефон}}
          <span><span class="контакт__что">{{КОНТАКТ_НАЗВАНИЕ_2}}</span><a href="{{КОНТАКТ_АДРЕС_2}}">{{КОНТАКТ_АДРЕС_2}}</a></span>
        </div>
        <div class="контакт">
          {{ИКОНКА:почта}}
          <span><span class="контакт__что">{{КОНТАКТ_НАЗВАНИЕ_3}}</span><a href="{{КОНТАКТ_АДРЕС_3}}">{{КОНТАКТ_АДРЕС_3}}</a></span>
        </div>
      </div>
      <div class="карточка карточка--стекло">
        {{ИКОНКА:чат}}
        <p class="лид">{{ПОДЗАГОЛОВОК}}</p>
        <div>{{СВЯЗЬ:Написать}}</div>
      </div>
    </div>
  </div>
</section>
