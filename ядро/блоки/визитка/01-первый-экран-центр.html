<section class="блок блок--первый-экран первый-экран--центр тёмный фон--сетка" id="экран-{{НОМЕР}}" data-тип="первый-экран" data-схема="центр" data-картинка="вырез">
  <div class="блок__внутри">
    <div class="центр__верх">
      <p class="кикер">{{КИКЕР}}</p>
      <h1>{{ЗАГОЛОВОК}} <em class="акцент">{{АКЦЕНТ}}</em></h1>
    </div>
    <figure class="картинка картинка--вырез первый-экран__картинка"><span class="опора"></span><span class="кольцо"></span><span class="кольцо кольцо--2"></span><img src="img/{{ФОТО}}" alt="{{ПОДПИСЬ_ФОТО}}" data-лицо="{{ЛИЦО}}" fetchpriority="high"></figure>
    <div class="центр__бок центр__бок--лево">
      <div class="карточка карточка--стекло парит">{{ИКОНКА:молния}}<b>{{ПУНКТ_1}}</b></div>
      <p class="лид">{{ПОДЗАГОЛОВОК}}</p>
      <div class="первый-экран__действие">{{СВЯЗЬ:Написать}}</div>
    </div>
    <div class="центр__бок центр__бок--право">
      <div class="карточка карточка--стекло парит парит--2">{{ИКОНКА:звезда}}<b>{{ПУНКТ_2}}</b></div>
      <div class="карточка карточка--стекло парит парит--3">{{ИКОНКА:галочка}}<b>{{ПУНКТ_3}}</b></div>
      <div class="карточка карточка--стекло парит парит--4">{{ИКОНКА:щит}}<span class="мелкий">{{ДОВЕРИЕ}}</span></div>
      <ul class="цифры">
        <li class="цифра карточка карточка--стекло"><b class="цифра__значение">{{ЦИФРА_1}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_1}}</span></li>
        <li class="цифра карточка карточка--стекло"><b class="цифра__значение">{{ЦИФРА_2}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_2}}</span></li>
        <li class="цифра карточка карточка--стекло"><b class="цифра__значение">{{ЦИФРА_3}}</b><span class="цифра__подпись">{{ПОДПИСЬ_ЦИФРЫ_3}}</span></li>
      </ul>
    </div>
  </div>
</section>
