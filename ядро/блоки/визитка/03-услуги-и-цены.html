<section class="блок блок--услуги-и-цены блок--громко светлый" id="экран-{{НОМЕР}}" data-тип="услуги-и-цены">
  <!-- Услуги и цены визитки: та же громкая секция и та же шапка по центру, что у тарифов лендинга,
       но карточка короче — имя, пояснение, цена с мелкой припиской. Ни матрёшки состава, ни
       медальона: на визитке человек выбирает услугу за секунду, а разворачивают её на лендинге.
       Один файл идёт и на «Услуги», и на «Цену».
       ⭐ Подсвечена та карточка, которую назвал прототип (поле «Подсветить»), а не средняя всегда:
       класс акцента переносишь ей, остальным его снимаешь. Поля нет — подсвечена средняя, как
       стоит ниже. Кнопка на этом экране одна на весь экран, под карточками после разделителя, —
       поэтому подсветка здесь только кромкой карточки, а не её кнопкой.
       Услуг 2–4, ниже стоят три образцовые копии: нужно больше — копируй article и нумеруй слоты
       подряд, нужно меньше — стирай лишние целиком, вместе с тегом article.
       Приписки у цены нет — сотри мелкий span; пояснения нет — сотри абзац; строки-пояснения под
       карточками нет — сотри её абзац. -->
  <span class="пятно" aria-hidden="true"></span>
  <span class="сетка-текстура" aria-hidden="true"></span>
  <div class="блок__внутри">
    <div class="секция__шапка секция__шапка--центр">
      <p class="кикер">{{КИКЕР}}</p>
      <h2>{{ЗАГОЛОВОК}}</h2>
      <p class="лид секция__лид">{{ПОДЗАГОЛОВОК}}</p>
    </div>
    <div class="тарифы секция__тело">
      <article class="тариф">
        <h3 class="тариф__имя">{{УСЛУГА_1}}</h3>
        <p class="тариф__пояснение">{{ОПИСАНИЕ_УСЛУГИ_1}}</p>
        <p class="тариф__цена"><b>{{ЦЕНА_1}}</b><span class="мелкий">{{УСЛОВИЕ_1}}</span></p>
      </article>
      <article class="тариф тариф--акцент">
        <h3 class="тариф__имя">{{УСЛУГА_2}}</h3>
        <p class="тариф__пояснение">{{ОПИСАНИЕ_УСЛУГИ_2}}</p>
        <p class="тариф__цена"><b>{{ЦЕНА_2}}</b><span class="мелкий">{{УСЛОВИЕ_2}}</span></p>
      </article>
      <article class="тариф">
        <h3 class="тариф__имя">{{УСЛУГА_3}}</h3>
        <p class="тариф__пояснение">{{ОПИСАНИЕ_УСЛУГИ_3}}</p>
        <p class="тариф__цена"><b>{{ЦЕНА_3}}</b><span class="мелкий">{{УСЛОВИЕ_3}}</span></p>
      </article>
    </div>
    <p class="мелкий">{{ПОЯСНЕНИЕ_ЦЕН}}</p>
    <hr class="разделитель">
    <div class="действие-секции">{{СВЯЗЬ:Написать}}</div>
  </div>
</section>
