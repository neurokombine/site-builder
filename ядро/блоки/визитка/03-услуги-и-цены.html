<section class="блок блок--услуги-и-цены светлый" id="экран-{{НОМЕР}}" data-тип="услуги-и-цены">
  <!-- Услуги и цены визитки: три карточки, у каждой своя иконка, цена крупно с линией слева,
       условие мелко под ней; средняя — главная. Один файл идёт и на «Услуги», и на «Цену». -->
  <div class="блок__внутри">
    <p class="кикер">{{КИКЕР}}</p>
    <h2>{{ЗАГОЛОВОК}}</h2>
    <div class="карточки">
      <article class="карточка">
        {{ИКОНКА:лупа}}
        <h3>{{УСЛУГА_1}}</h3>
        <p>{{ОПИСАНИЕ_УСЛУГИ_1}}</p>
        <p class="цифра"><b class="цифра__значение">{{ЦЕНА_1}}</b><span class="цифра__подпись">{{УСЛОВИЕ_1}}</span></p>
      </article>
      <article class="карточка карточка--главная">
        {{ИКОНКА:календарь}}
        <h3>{{УСЛУГА_2}}</h3>
        <p>{{ОПИСАНИЕ_УСЛУГИ_2}}</p>
        <p class="цифра"><b class="цифра__значение">{{ЦЕНА_2}}</b><span class="цифра__подпись">{{УСЛОВИЕ_2}}</span></p>
      </article>
      <article class="карточка">
        {{ИКОНКА:награда}}
        <h3>{{УСЛУГА_3}}</h3>
        <p>{{ОПИСАНИЕ_УСЛУГИ_3}}</p>
        <p class="цифра"><b class="цифра__значение">{{ЦЕНА_3}}</b><span class="цифра__подпись">{{УСЛОВИЕ_3}}</span></p>
      </article>
    </div>
  </div>
</section>
