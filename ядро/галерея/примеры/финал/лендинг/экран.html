<section class="блок блок--финал ключ--наоборот фон--пятна" id="экран-{{НОМЕР}}" data-тип="финал">
  <!-- Финальный призыв во всю ширину. Фотография лежит на всей секции и медленно наезжает (это
       движение уже видимой картинки, а не появление при прокрутке), поверх неё — оверлей: на
       телефоне снизу вверх, на компьютере слева направо, чтобы текст и таймер читались. Слева
       колонка до 560 px: кикер, крупный заголовок, «почему сейчас», главная кнопка, подпись под
       ней и строка «куда написать до заявки». Справа — стеклянная карточка с живым таймером.
       Своя телефонная фотография стоит в source: общий кадр на узком экране режет лицо.
       ⛔ Фотографии нет — сотри figure и оверлей целиком. Экран остаётся на своей атмосфере
       (класс фона в первой строке), и это нормальный второй вид, а не дыра: заглушку-картинку
       сюда не ставят — серое поле во всю секцию под главной кнопкой убивает призыв, а довод
       этого экрана — кнопка, а не кадр. Фотография есть — она во всю секцию, и атмосфера под
       ней не нужна.
       Таймер тикает таймер.js по data-дедлайн: ISO с московским смещением +03:00, и то же число
       словами рядом. Правило прежнее, даже если в макете таймера не видно, — у дела из макета
       просто нет живой даты, а не «таймер отменили». Есть дата — карточка справа от текста; нет
       даты — сотри карточку целиком вместе со строкой «До … (МСК)», и текст встанет во всю
       ширину: нули на экране хуже пустоты, а придуманная спешка хуже нулей.
       Строка под кнопкой — почта и телефон из профиля дословно. Адрес стоит дважды: в href —
       ссылка (mailto:, tel:), в тексте — то, что человек прочтёт глазами. Способ один — сотри
       вторую ссылку вместе с предлогом, нет ни одного — сотри всю строку. -->
  <figure class="фото финал__фото">
    <picture><source media="(max-width: 899px)" srcset="img/{{ФОТО_ТЕЛЕФОН}}"><img src="img/{{ФОТО}}" alt="{{ПОДПИСЬ_ФОТО}}"></picture>
  </figure>
  <div class="финал__оверлей" aria-hidden="true"></div>
  <div class="блок__внутри">
    <div class="пара">
      <div class="пара__текст финал__текст">
        <p class="кикер">{{КИКЕР}}</p>
        <h2>{{ЗАГОЛОВОК}}</h2>
        <p class="лид">{{ПОЧЕМУ_СЕЙЧАС}}</p>
        <div>{{СВЯЗЬ:Оставить заявку}}</div>
        <p class="мелкий">{{ПОДПИСЬ_ПОД_КНОПКОЙ}}</p>
        <p class="финал__контакты">Вопросы до заявки — на почту <a href="{{КОНТАКТ_АДРЕС_1}}">{{КОНТАКТ_АДРЕС_1}}</a> или по телефону <a href="{{КОНТАКТ_АДРЕС_2}}">{{КОНТАКТ_АДРЕС_2}}</a></p>
      </div>
      <div class="карточка карточка--стекло">
        <div class="таймер" data-дедлайн="{{ДЕДЛАЙН}}">
          <div class="таймер__ячейка"><b>00</b><span>дн</span></div>
          <div class="таймер__ячейка"><b>00</b><span>ч</span></div>
          <div class="таймер__ячейка"><b>00</b><span>мин</span></div>
        </div>
        <p class="мелкий">{{ИКОНКА:часы}} До {{ДЕДЛАЙН_СЛОВАМИ}} (МСК)</p>
      </div>
    </div>
  </div>
</section>
