<section class="блок блок--что-получите ключ--основной" id="экран-{{НОМЕР}}" data-тип="что-получите">
  <!-- Что получите: разворот средней громкости — слева шапка и список галок «что остаётся у
       человека», под ним врезка-итог; справа парящая фотография с подписью-плашкой поверх нижней
       кромки кадра. Пятно в дальнем верхнем углу: секция средней громкости не бывает плоской
       заливкой, отделку ей держат градиент и это пятно.
       Пунктов 3–8, ниже стоят три образцовые копии: нужно больше — копируй li и нумеруй слоты
       подряд, нужно меньше — стирай лишние целиком, вместе с тегом li.
       ⛔ Длинное тире внутри пункта видно человеку: на экране он читает ту же фразу, которую написал
       в прототипе. Деление пункта на две части — это про то, как система его ЧИТАЕТ, а не про то,
       как печатает. Поэтому тире стоит ВНУТРИ того же span, что и пояснение, и первым в нём:
       пояснения у пункта нет (в прототипе не было тире) — стираешь span целиком, вместе с тире, и
       висячего тире после жирного заголовка не остаётся. Копируешь приём в свой блок — копируй
       вместе с этим правилом. Подзаголовка нет — сотри лид, шапка встанет без него.
       Врезки нет (в прототипе нет строки «После шагов») — сотри её целиком.
       Фотографии нет — сотри figure целиком: текстовая колонка сама встанет на всю ширину, и
       дырки на месте кадра не останется. Подписи к кадру нет — сотри figcaption, кадр останется,
       а подпись для незрячего в alt допиши словами. -->
  <span class="пятно" aria-hidden="true"></span>
  <div class="блок__внутри">
    <div class="разворот__сетка">
      <div class="секция__тело">
        <div class="секция__шапка">
          <p class="кикер">{{КИКЕР}}</p>
          <h2>{{ЗАГОЛОВОК}}</h2>
          <p class="лид секция__лид">{{ПОДЗАГОЛОВОК}}</p>
        </div>
        <ul class="список-иконок">
          <li><i class="галка"></i><span><b>{{ПОЛУЧИТЕ_1}}</b><span> — {{ПОЯСНЕНИЕ_1}}</span></span></li>
          <li><i class="галка"></i><span><b>{{ПОЛУЧИТЕ_2}}</b><span> — {{ПОЯСНЕНИЕ_2}}</span></span></li>
          <li><i class="галка"></i><span><b>{{ПОЛУЧИТЕ_3}}</b><span> — {{ПОЯСНЕНИЕ_3}}</span></span></li>
        </ul>
        <div class="врезка">
          <b>{{ИТОГ}}</b>
          <p>{{ПОЯСНЕНИЕ_ИТОГА}}</p>
        </div>
      </div>
      <figure class="фото парит">
        <img src="img/{{ФОТО}}" alt="{{ПОДПИСЬ_ФОТО}}">
        <figcaption class="плашка фото__подпись">{{ПОДПИСЬ_ФОТО}}</figcaption>
      </figure>
    </div>
  </div>
</section>
